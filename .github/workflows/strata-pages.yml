# Strata : publie le site (strata/site/) sur GitHub Pages, devredious.github.io/strata.
# Site statique, sans compilation : le dossier est publié tel quel.
name: Strata site

on:
    push:
        branches:
            - main
        paths:
            - strata/site/**
            - .github/workflows/strata-pages.yml
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: strata-pages
    cancel-in-progress: false

jobs:
    deploy:
        if: github.repository == 'DevRedious/strata'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v7

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: strata/site

            - id: deployment
              uses: actions/deploy-pages@v5
